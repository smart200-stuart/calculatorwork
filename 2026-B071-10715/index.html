<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator Interface Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ichi">
        <div class="chi">
            <h1>0</h1>
        </div>
        <div class="ichiji">
            <button class="sa add">AC</button>
            <button class="sa">00</button>
            <button class="sa">%</button>
            <button class="sa addd">/</button>
        </div>
        <div class="ichiji">
            <button class="sa">7</button>
            <button class="sa">8</button>
            <button class="sa">9</button>
            <button class="sa addd">x</button>
        </div>
        <div class="ichiji">
            <button class="sa">4</button>
            <button class="sa">5</button>
            <button class="sa">6</button>
            <button class="sa addd">-</button>
        </div>
        <div class="ichiji">
            <button class="sa">1</button>
            <button class="sa">2</button>
            <button class="sa">3</button>
            <button class="sa addd">+</button>
        </div>
        <div class="ichiji">
            <button class="sa sai">0</button>
            <button class="sa">.</button>
            <button class="sa adddd " onclick="dda()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
